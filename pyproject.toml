[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-usage-billing-engine"
version = "0.1.0"
description = "Event-driven idempotent usage-based billing pipeline (POC v0.1)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "mcp>=1.0,<2",  # 2.x renamed FastMCP
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov>=5", "hypothesis>=6", "httpx", "locust", "pyyaml>=6",
       "ruff==0.11.10"]
streaming = ["confluent-kafka>=2.4"]
aws = ["boto3", "aws-cdk-lib>=2.150", "constructs>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not perf'"
markers = [
  "e2e: cross-process end-to-end tests (spawn uvicorn / worker / MCP stdio)",
  "perf: load/latency tests against a live API + worker (run with -m perf)",
  "property: Hypothesis property-based and stateful tests",
  "concurrency: multi-thread / multi-process contention tests",
  "req(*ids): PRD requirement(s) a test verifies, e.g. FR2 or NFR-CORRECTNESS",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the lint baseline explicit: newer Ruff releases enable additional
# rule families by default, which would otherwise change CI without a code change.
select = ["E4", "E7", "E9", "F"]
