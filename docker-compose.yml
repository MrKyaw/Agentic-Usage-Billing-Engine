# api + worker share one SQLite DB. Paths are set here (not only in .env) because
# .env.example uses host-relative paths that would give each container its own DB.
# The DB lives on a named volume: Docker Desktop bind mounts (macOS/Windows) do not
# enforce SQLite file locks across containers. Only CSV exports go to the host
# (create ./data/exports first; `make up` does).
x-app: &app
  image: billing-engine:local
  env_file: [{path: .env, required: false}]
  environment:
    BILLING_API_KEY: ${BILLING_API_KEY:-dev-key-123}
    BILLING_DB_PATH: /data/billing.db
    BILLING_RAW_LOG_DIR: /data/raw-log
    BILLING_EXPORT_DIR: /data/exports
    BILLING_PLAN_PATH: /app/src/billing_engine/price_plans.json
  volumes:
    - billing-data:/data
    - ${DATA_DIR:-./data}/exports:/data/exports
  restart: unless-stopped

services:
  api:
    <<: *app
    build: .
    ports: ["${PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
  worker:
    <<: *app
    pull_policy: never  # reuses the image built by the api service
    command: ["python", "-m", "billing_engine.worker"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  billing-data:
