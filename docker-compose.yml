# The whole billing solution in one Compose project: the monolith (API +
# worker) plus the optional Kafka + Flink streaming tier.
#
#   make up            monolith only: API + worker, SQLite inbox (default)
#   make up-streaming  whole solution: API + worker in Kafka mode + Kafka + Flink
#
# One variable switches the whole system between the two transports:
# BILLING_KAFKA_BOOTSTRAP.
#   empty          -> the API writes the raw log + SQLite inbox in one
#                     transaction and the worker polls the inbox.
#   kafka:9092     -> the API writes the raw log and publishes to Kafka (no
#                     inbox row) and the worker consumes the raw topic.
# The raw log stays the durable source of truth in both modes, and the ledger's
# conditional insert on event_id stays the authoritative dedupe.
#
# The streaming tier is a Compose profile, so the default stack stays small.
# Paths are set here (not only in .env) because .env.example uses host-relative
# paths that would give each container its own DB. The DB lives on a named
# volume: Docker Desktop bind mounts (macOS/Windows) do not enforce SQLite file
# locks across containers. Only CSV exports go to the host
# (create ./data/exports first; `make up` does).
x-app: &app
  image: billing-engine:local
  env_file: [{path: .env, required: false}]
  environment:
    BILLING_API_KEY: ${BILLING_API_KEY:-dev-key-123}
    BILLING_DB_PATH: /data/billing.db
    BILLING_RAW_LOG_DIR: /data/raw-log
    BILLING_EXPORT_DIR: /data/exports
    BILLING_PLAN_PATH: /app/src/billing_engine/price_plans.json
    # One switch for the whole system (see the header).
    BILLING_KAFKA_BOOTSTRAP: ${BILLING_KAFKA_BOOTSTRAP:-}
    BILLING_KAFKA_TOPIC: ${BILLING_KAFKA_TOPIC:-usage-events}
    BILLING_KAFKA_DLQ_TOPIC: ${BILLING_KAFKA_DLQ_TOPIC:-usage-events-dlq}
    BILLING_KAFKA_GROUP: ${BILLING_KAFKA_GROUP:-billing-worker}
    BILLING_KAFKA_OFFSET_RESET: ${BILLING_KAFKA_OFFSET_RESET:-earliest}
  volumes:
    - billing-data:/data
    - ${DATA_DIR:-./data}/exports:/data/exports
  restart: unless-stopped

x-flink: &flink
  image: billing-flink:local
  pull_policy: never
  profiles: [streaming]
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      rest.port: 8081
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 2
      state.backend: hashmap
      execution.checkpointing.interval: 10s
  volumes:
    - flink-checkpoints:/opt/flink/checkpoints

services:
  api:
    <<: *app
    build: .
    ports: ["${PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      # Only meaningful in the streaming profile; required:false keeps the
      # default (monolith) stack valid without Kafka.
      kafka-init: {condition: service_completed_successfully, required: false}

  worker:
    <<: *app
    pull_policy: never  # reuses the image built by the api service
    # One entry point for both transports: with BILLING_KAFKA_BOOTSTRAP set the
    # worker consumes the Kafka topic, otherwise it polls the SQLite inbox.
    command: ["python", "-m", "billing_engine.worker"]
    depends_on:
      api: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully, required: false}

  # ------------------------------------------------------------ streaming tier
  kafka:
    profiles: [streaming]
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-29092}:${KAFKA_PORT:-29092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_PORT:-29092}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 20
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-init:
    profiles: [streaming]
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/topics/create-topics.sh"]
    volumes:
      - ./infra/streaming/kafka:/topics:ro

  jobmanager:
    <<: *flink
    build:
      context: ./infra/streaming/flink
    command: jobmanager
    ports:
      - "${FLINK_PORT:-8081}:8081"
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      jobmanager: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}

  flink-submit:
    <<: *flink
    command: >
      bash -c "for i in $$(seq 1 60); do curl -fsS http://jobmanager:8081/overview >/dev/null 2>&1 && break; sleep 2; done;
      /opt/flink/bin/sql-client.sh -Drest.address=jobmanager -Drest.port=8081 -Dexecution.target=remote -Dexecution.attached=false -f /opt/flink/jobs/window_aggregates.sql"
    volumes:
      - ./infra/streaming/flink/jobs:/opt/flink/jobs:ro
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      jobmanager: {condition: service_started}
      taskmanager: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}
    restart: "no"

volumes:
  billing-data:
  flink-checkpoints:
